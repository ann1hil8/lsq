[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsq"
version = "0.2.0"
description = "Script-driven laboratory instrument control and test automation framework"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "pyvisa>=1.14"]

[project.scripts]
lsq = "lsq.cli:main"

[tool.setuptools.packages.find]
include = ["lsq*"]

[tool.setuptools.package-data]
lsq = ["devices/catalogs/*.json"]
